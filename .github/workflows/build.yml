aml
name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
      - name: Build APK
        run: |
          cd TV_Closer_v3.0_AutoActivate
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: apk
          path: TV_Closer_v3.0_AutoActivate/app/build/outputs/apk/debug/app-debug.apk
