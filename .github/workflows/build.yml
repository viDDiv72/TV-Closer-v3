name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
      - uses: gradle/gradle-build-action@v2
      - name: Build APK
        run: |
          cd TV_Closer_v3.0_AutoActivate
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TV_Closer_v3.0_AutoActivate/app/build/outputs/apk/debug/app-debug.apk
